name: Build and Release Sonora APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web interface with one click

jobs:
  build:
    name: Build Ultra-Compact APK for Redmi 12 5G
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Prepare APK Release
        run: |
          echo "=== GRADLE LOG ==="
          tail -n 30 build.log
          echo "=== LOCATING APK ==="
          mkdir -p release_apk
          APK_PATH=$(find app/build -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release_apk/Sonora-v1.0.0-Redmi12-5G.apk
            ls -lh release_apk/
          else
            echo "ERROR: No APK found!"
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-Redmi12-5G-APK
          path: release_apk/Sonora-v1.0.0-Redmi12-5G.apk
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Sonora Music Player v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### 🎵 Sonora Music Player for Redmi 12 5G
            
            - **Optimized for**: Redmi 12 5G (MIUI / HyperOS, Snapdragon 4 Gen 2)
            - **Storage Mode**: Ultra-Compact Opus/AAC engine (~1.2 MB per song)
            - **Background Playback**: Continuous playback with lock-screen & media controls
            - **Install**: Download `Sonora-v1.0.0-Redmi12-5G.apk` below directly onto your phone and tap to install!
          files: release_apk/Sonora-v1.0.0-Redmi12-5G.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
